[project]
name = "medora"
version = "0.1.0"
description = "An autonomous agentic system for doctors, medical students, healthcare professionals and researchers to discover and synthesize clinical evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "openai-agents>=0.20.0",
    "fastapi",
    "uvicorn[standard]",
    "openai>=2.54.0",
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.5.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
    "cryptography>=50.0.0",
    "psycopg-pool>=3.3.3",
]
